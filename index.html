<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Crime Reporting Portal — Supportive Reporting Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="go-home" aria-label="Go to home">
          <span class="brand-mark" aria-hidden="true">CC</span>
          <span>
            <strong>Cyber Crime Reporting Portal</strong>
            <small>Independent hackathon prototype · Not a government service</small>
          </span>
        </button>
        <div class="topbar-actions">
          <a class="urgent-link" href="tel:1930" aria-label="Call cybercrime helpline 1930">Call 1930</a>
          <div id="authControls" class="auth-controls">
            <button id="loginButton" class="auth-button" type="button" data-action="open-login">Login</button>
            <button id="signupButton" class="auth-button" type="button" data-action="open-signup">Sign up</button>
          </div>
        </div>
      </header>

      <nav id="journeyProgress" class="journey-progress hidden" aria-label="Report progress"></nav>
      <main id="app" class="app-main" tabindex="-1"></main>
      <div id="globalStatus" class="sr-only" role="status" aria-live="polite"></div>
      <footer class="app-footer site-footer" role="contentinfo">
        <div class="site-footer-top">
          <nav class="site-footer-links" aria-label="Prototype site links">
            <button type="button" data-action="open-site-info" data-topic="feedback">Feedback</button>
            <button type="button" data-action="open-site-info" data-topic="faq">FAQ</button>
            <button type="button" data-action="open-site-info" data-topic="contact">Contact Us</button>
            <button type="button" data-action="open-site-info" data-topic="policies">Website Policies</button>
            <button type="button" data-action="open-site-info" data-topic="privacy">Privacy Policy</button>
            <button type="button" data-action="open-site-info" data-topic="disclaimer">Disclaimer</button>
          </nav>
          <div class="site-footer-social" aria-label="Demo social links">
            <span class="social-dot social-x" title="Demo link">X</span>
            <span class="social-dot social-fb" title="Demo link">f</span>
            <span class="social-dot social-yt" title="Demo link">▶</span>
            <span class="social-dot social-ig" title="Demo link">ig</span>
            <span class="social-dot social-tg" title="Demo link">✈</span>
            <span class="social-dot social-in" title="Demo link">in</span>
          </div>
        </div>
      </footer>
      <button class="back-to-top" type="button" data-action="back-to-top" aria-label="Back to top">↑</button>
    </div>

    <template id="login-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-action="auth-back">Back</button>
        <p class="eyebrow">Login</p>
        <h2>Sign in with mobile OTP</h2>
        <p class="support-note">Use any 10-digit mobile number and mocked OTP <strong>123456</strong>. Once signed in, filing and tracking will not ask you to log in again during this session.</p>
        <label>Mobile number
          <input id="loginMobileInput" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" />
        </label>
        <button class="secondary" type="button" data-action="send-login-otp">Get OTP</button>
        <div id="loginOtpArea" class="hidden otp-block">
          <p class="hint">Mocked OTP: <strong>123456</strong></p>
          <label>Enter OTP
            <input id="loginOtpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
          </label>
          <button class="primary" type="button" data-action="verify-login-otp">Enter OTP</button>
        </div>
      </section>
    </template>

    <template id="signup-template">
      <section class="panel">
        <button class="ghost back" type="button" data-action="auth-back">Back</button>
        <p class="eyebrow">Sign up</p>
        <h2>Create your reporting profile</h2>
        <p class="support-note">Verify your mobile number, then upload an identity document to prepare personal details. This is a prototype session only.</p>
        <section class="person-group" id="signupStep1" aria-labelledby="signupMobileHeading">
          <div class="person-group-heading">
            <div><p class="eyebrow">Step 1</p><h3 id="signupMobileHeading">Verify mobile</h3></div>
            <span id="signupStep1Badge" class="role-badge hidden">Verified</span>
          </div>
          <label>Mobile number
            <input id="signupMobileInput" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" />
          </label>
          <button id="sendSignupOtpButton" class="secondary" type="button" data-action="send-signup-otp">Get OTP</button>
          <div id="signupOtpArea" class="hidden otp-block">
            <p class="hint">Mocked OTP: <strong>123456</strong></p>
            <label>Enter OTP
              <input id="signupOtpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
            </label>
            <button id="verifySignupOtpButton" class="primary" type="button" data-action="verify-signup-otp">Enter OTP</button>
          </div>
        </section>
        <section id="signupIdentityArea" class="person-group hidden" aria-labelledby="signupIdentityHeading">
          <div class="person-group-heading">
            <div><p class="eyebrow">Step 2</p><h3 id="signupIdentityHeading">Add identity</h3></div>
          </div>
          <label>Identity document type
            <select id="signupIdentityType">
              <option value="Aadhaar">Aadhaar</option>
              <option value="PAN card">PAN card</option>
              <option value="Driving licence">Driving licence</option>
              <option value="Voter ID">Voter ID</option>
            </select>
          </label>
          <div class="upload-zone">
            <input id="signupIdentityUpload" type="file" accept="image/*,.pdf" />
            <div>
              <strong>Upload identity document</strong>
              <span>PNG, JPG, PDF · Up to 4 MB</span>
            </div>
            <button class="secondary" type="button" data-action="process-signup-profile">Extract identity details</button>
            <button class="secondary" type="button" data-action="fill-signup-profile">Use sample identity</button>
          </div>
          <div id="signupAuthIdentityDocument" class="document-display"></div>
        </section>
        <div id="signupProfileArea" class="hidden">
          <h3 class="form-section-title">Personal details</h3>
          <div class="form-grid signup-profile-form"></div>
          <div class="button-row">
            <button class="primary" type="button" data-action="save-signup">Save</button>
          </div>
        </div>
      </section>
    </template>

    <template id="home-template">
      <div class="home-screen">
        <div class="home-scroll">
          <section class="hero">
            <img src="assets/nccrp-hero.png" alt="Digital help desk scene for reporting online financial crime" />
            <div class="hero-overlay">
              <p class="eyebrow">A simpler way to report cybercrime</p>
              <h1>You are not alone.<br />We’ll help you report what happened.</h1>
              <p class="hero-copy">Reporting for yourself or helping someone else? We'll guide you both.</p>
              <div class="choice-grid">
                <button class="choice-card primary-choice" type="button" data-action="start-financial-report">
                  <span class="choice-icon" aria-hidden="true">₹</span>
                  <span>
                    <strong>Money taken from your account?</strong>
                    <small>Upload your payment screenshot or bank SMS and prepare your financial fraud report.</small>
                    <em class="choice-cta">Prepare a financial fraud report →</em>
                  </span>
                </button>
                <button class="choice-card" type="button" data-action="start-wc-report">
                  <span class="choice-icon" aria-hidden="true">!</span>
                  <span>
                    <strong>Something unsafe happened online?</strong>
                    <small>Share the evidence you have and prepare a report you can review.</small>
                    <em class="choice-cta">Report online abuse →</em>
                  </span>
                </button>
                <button class="choice-card" type="button" data-next="trackingHome">
                  <span class="choice-icon" aria-hidden="true">?</span>
                  <span>
                    <strong>Already reported a cybercrime?</strong>
                    <small>Check status and track your complaint.</small>
                    <em class="choice-cta">Track complaint →</em>
                  </span>
                </button>
              </div>
            </div>
          </section>

          <section class="home-section" id="how-it-works" aria-labelledby="how-it-works-heading">
            <p class="eyebrow">How it works</p>
            <h2 id="how-it-works-heading">Three steps from evidence to a reviewable draft</h2>
            <div class="step-row">
              <article class="step-card">
                <span class="step-num" aria-hidden="true">1</span>
                <strong>Share what you have</strong>
                <p>Upload a payment screenshot, bank SMS, chat, or voice note—or enter details manually.</p>
              </article>
              <article class="step-card">
                <span class="step-num" aria-hidden="true">2</span>
                <strong>We organise a draft</strong>
                <p>Scattered details are turned into structured report fields you can read in plain language.</p>
              </article>
              <article class="step-card">
                <span class="step-num" aria-hidden="true">3</span>
                <strong>You review and confirm</strong>
                <p>Correct anything that looks wrong. Nothing is submitted until you explicitly confirm.</p>
              </article>
            </div>
          </section>

          <section class="home-section" id="demo-stats" aria-labelledby="demo-stats-heading">
            <p class="eyebrow">Demo figures for this prototype — not official NCRP data</p>
            <h2 id="demo-stats-heading">Sample activity in this build</h2>
            <div class="stat-grid">
              <div class="stat-card">
                <strong>128</strong>
                <span>Reports prepared</span>
              </div>
              <div class="stat-card">
                <strong>84</strong>
                <span>Financial fraud drafts</span>
              </div>
              <div class="stat-card">
                <strong>44</strong>
                <span>Online abuse drafts</span>
              </div>
              <div class="stat-card">
                <strong>~6 min</strong>
                <span>Avg. time to prepare</span>
              </div>
            </div>
          </section>

          <section class="home-section" id="stay-alert" aria-labelledby="stay-alert-heading">
            <p class="eyebrow">Stay alert</p>
            <h2 id="stay-alert-heading">Common patterns we see in sample evidence</h2>
            <div class="pattern-grid">
              <article class="pattern-card">
                <strong>UPI “collect” request</strong>
                <p>Someone asks you to approve a payment request that actually sends money out of your account.</p>
              </article>
              <article class="pattern-card">
                <strong>Fake KYC / bank link</strong>
                <p>A rushed SMS or WhatsApp message pushes you to “verify” on a lookalike website.</p>
              </article>
              <article class="pattern-card">
                <strong>Job-offer advance fee</strong>
                <p>A hiring “agent” asks for registration or training fees before any real offer exists.</p>
              </article>
            </div>
            <button class="primary home-section-cta" type="button" data-next="scamDirectory">Open scam directory →</button>
          </section>
        </div>

        <aside class="help-strip" id="emergency-help" aria-label="Emergency help numbers">
          <strong class="help-strip-title">Need help right now?</strong>
          <span><strong>Financial fraud:</strong> Call <a href="tel:1930">1930</a> immediately to report cyber financial fraud.</span>
          <span><strong>Immediate danger:</strong> Call <a href="tel:112">112</a> for emergency police assistance. Women can also call <a href="tel:181">181</a> for support; <a href="tel:1098">1098</a> is the Child Helpline.</span>
        </aside>
      </div>
    </template>

    <template id="site-info-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-action="go-home">Back</button>
        <p class="eyebrow" id="siteInfoEyebrow">About this prototype</p>
        <h2 id="siteInfoTitle">Information</h2>
        <p class="support-note" id="siteInfoBody"></p>
      </section>
    </template>

    <template id="scam-directory-template">
      <section class="panel scam-directory-panel">
        <button class="ghost back" type="button" data-action="go-home">Back</button>
        <p class="eyebrow">Awareness tool</p>
        <h2>Scam indicator directory (demo)</h2>
        <p class="support-note">Synthetic sample data only. This is not a police database, does not prove guilt, and must not be used to accuse anyone. For awareness inside this prototype.</p>
        <div class="scam-check-form">
          <label>What are you checking?
            <select id="scamCheckType">
              <option value="site">Site URL</option>
              <option value="email">Email</option>
              <option value="phone">Phone</option>
              <option value="person">Person / username</option>
            </select>
          </label>
          <label>Value
            <input id="scamCheckInput" type="text" placeholder="e.g. pay-secure-demo.example or @sample_agent" autocomplete="off" />
          </label>
          <button class="primary" type="button" data-action="check-scam-indicator">Check</button>
        </div>
        <div id="scamCheckResult" class="scam-check-result hidden" role="status" aria-live="polite"></div>
        <h3 class="form-section-title">Sample indicators in this demo</h3>
        <div class="scam-sample-table" role="table" aria-label="Sample scam indicators">
          <div class="scam-sample-row scam-sample-head" role="row">
            <span role="columnheader">Type</span>
            <span role="columnheader">Sample value</span>
            <span role="columnheader">Note</span>
          </div>
          <div class="scam-sample-row" role="row">
            <span role="cell">Site</span>
            <span role="cell">pay-secure-demo.example</span>
            <span role="cell">SAMPLE — fake KYC page</span>
          </div>
          <div class="scam-sample-row" role="row">
            <span role="cell">Email</span>
            <span role="cell">refund-desk@demo-bank.test</span>
            <span role="cell">SAMPLE — spoofed support</span>
          </div>
          <div class="scam-sample-row" role="row">
            <span role="cell">Phone</span>
            <span role="cell">9876500001</span>
            <span role="cell">SAMPLE — fake OTP caller</span>
          </div>
          <div class="scam-sample-row" role="row">
            <span role="cell">UPI / person</span>
            <span role="cell">urgent-kyc@upi.demo</span>
            <span role="cell">SAMPLE — collect request</span>
          </div>
          <div class="scam-sample-row" role="row">
            <span role="cell">Username</span>
            <span role="cell">@hiring_agent_demo</span>
            <span role="cell">SAMPLE — job advance fee</span>
          </div>
          <div class="scam-sample-row" role="row">
            <span role="cell">Site</span>
            <span role="cell">verify-wallet-now.test</span>
            <span role="cell">SAMPLE — wallet takeover lure</span>
          </div>
        </div>
      </section>
    </template>

    <template id="tracking-home-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-action="go-home">Back</button>
        <p class="eyebrow">Complaint tracking</p>
        <h2>Track submitted complaints</h2>
        <p class="support-note">This prototype shows sample statuses only. It does not connect to the official portal or retrieve real complaint data.</p>
        <div class="two-actions">
          <button class="choice-card primary-choice" type="button" data-next="trackingLookup">
            <span class="choice-icon" aria-hidden="true">#</span>
            <span><strong>Enter acknowledgement number</strong><small>Check the status of one submitted request</small></span>
          </button>
          <button class="choice-card" type="button" data-action="open-tracking-list">
            <span class="choice-icon" aria-hidden="true">↻</span>
            <span><strong>View all requests</strong><small>Sign in once to see sample complaint history</small></span>
          </button>
        </div>
      </section>
    </template>

    <template id="tracking-lookup-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-next="trackingHome">Back</button>
        <p class="eyebrow">Acknowledgement lookup</p>
        <h2>Enter acknowledgement number</h2>
        <label>Acknowledgement number
          <input id="ackInput" type="text" placeholder="NCCRP-FIN-2026-10482" autocomplete="off" />
        </label>
        <div class="button-row">
          <button class="secondary" type="button" data-action="fill-sample-ack">Use sample number</button>
          <button class="primary" type="button" data-action="lookup-ack">Show complaint status</button>
        </div>
        <div id="trackingLookupResult" class="tracking-result"></div>
      </section>
    </template>

    <template id="tracking-login-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-next="trackingHome">Back</button>
        <p class="eyebrow">Mock login</p>
        <h2>View all submitted requests</h2>
        <p class="support-note">Use any 10-digit mobile number and mocked OTP <strong>123456</strong>. No real authentication happens.</p>
        <label>Mobile number
          <input id="trackingMobileInput" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" />
        </label>
        <button class="secondary" type="button" data-action="send-tracking-otp">Get OTP</button>
        <div id="trackingOtpArea" class="hidden">
          <p class="hint">Mocked OTP sent: <strong>123456</strong></p>
          <label>Enter OTP
            <input id="trackingOtpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
          </label>
          <button class="primary" type="button" data-action="verify-tracking-otp">Verify and view requests</button>
        </div>
      </section>
    </template>

    <template id="tracking-list-template">
      <section class="panel">
        <button class="ghost back" type="button" data-next="trackingHome">Back</button>
        <p class="eyebrow">All sample requests</p>
        <h2>Submitted complaint status</h2>
        <div id="trackingList" class="request-list"></div>
      </section>
    </template>

    <template id="tracking-detail-template">
      <section class="panel">
        <button class="ghost back" type="button" data-action="tracking-detail-back">Back</button>
        <p class="eyebrow">Complaint status</p>
        <h2 id="trackingDetailTitle">Request detail</h2>
        <div id="trackingDetailContent" class="preview-grid"></div>
      </section>
    </template>

    <template id="women-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-action="go-home">Back</button>
        <p class="eyebrow">You can report safely</p>
        <h2>Crime Against Women and Children</h2>
        <aside class="danger-card" aria-label="Immediate danger guidance">
          <strong>Are you or someone else in immediate danger?</strong>
          <span>Call India’s emergency number <a href="tel:112">112</a>. This prototype cannot provide emergency help.</span>
        </aside>
        <p>You can continue without sharing your identity. Add only what feels safe to share, and pause at any time. This prototype does not send anything to the official portal.</p>
        <div class="two-actions">
          <button class="choice-card primary-choice" type="button" data-action="start-wc-anonymous">
            <span class="choice-icon" aria-hidden="true">•</span>
            <span><strong>Report anonymously</strong><small>No login or contact details required</small></span>
          </button>
          <button class="choice-card" type="button" data-action="start-wc-signed-in">
            <span class="choice-icon" aria-hidden="true">↻</span>
            <span><strong>Use signed-in details</strong><small>Login / Sign up once from the header</small></span>
          </button>
        </div>
      </section>
    </template>

    <template id="wc-login-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-next="womenChildren">Back</button>
        <p class="eyebrow">Mock login</p>
        <h2>Verify your mobile number</h2>
        <p class="support-note">This step is mocked. Use it only if you want the prototype to show a logged-in report path.</p>
        <label>Mobile number
          <input id="wcMobileInput" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" />
        </label>
        <button class="secondary" type="button" data-action="send-wc-otp">Get OTP</button>
        <div id="wcOtpArea" class="hidden">
          <p class="hint">Mocked OTP sent: <strong>123456</strong></p>
          <label>Enter OTP
            <input id="wcOtpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
          </label>
          <button class="primary" type="button" data-action="verify-wc-otp">Verify and continue</button>
        </div>
      </section>
    </template>

    <template id="wc-start-template">
      <section class="panel prereq-panel">
        <button class="ghost back" type="button" data-next="womenChildren">Back</button>
        <p class="eyebrow" id="wcModeLabel">Anonymous report</p>
        <h2>Keep these details ready</h2>
        <p class="support-note">Add screenshots or notes you feel safe sharing, or enter details manually. You stay in control of how much you reveal.</p>
        <div class="prereq-layout">
          <div class="prereq-list">
            <h3>Information you may need</h3>
            <ul class="ready-list">
              <li>Approximate date and time of the incident</li>
              <li>Platform, app, or website where it happened</li>
              <li>Usernames, profile links, or phone numbers involved</li>
              <li>Screenshots of conversations or threats</li>
              <li>Any related photos, videos, or documents</li>
              <li>Only the personal details you feel safe sharing</li>
            </ul>
            <p class="hint">You can correct or complete missing information in the report.</p>
            <button class="secondary" type="button" data-action="start-wc-manual">Enter details manually</button>
          </div>
          <div class="or-divider" aria-hidden="true"><span>or</span></div>
          <div class="evidence-card">
            <h3>Let AI prepare a starting draft</h3>
            <p class="upload-intro">Upload screenshots of conversations, bank statements, photos, videos, documents, or voice notes. Add what you already have—you can review everything before continuing.</p>
            <ul class="evidence-examples">
              <li>Documents (PDF, DOCX, XLSX, CSV)</li>
              <li>Screenshots and photos (PNG, JPG)</li>
              <li>Videos (MP4, WEBM)</li>
              <li>Voice notes (M4A, WEBM, MP3)</li>
            </ul>
            <label class="file-drop">
              <input id="wcEvidenceUpload" type="file" accept="image/*,video/*,.pdf,.docx,.xlsx,.csv,.mp4,.webm" multiple aria-describedby="wcUploadHelp selectedWcFiles" />
              <span class="file-drop-icon" aria-hidden="true">↑</span>
              <strong>Choose documents, screenshots, or videos</strong>
              <small id="wcUploadHelp">PNG, JPG, PDF, DOCX, XLSX, CSV, MP4, WEBM · Up to 4 MB total</small>
            </label>
            <p id="selectedWcFiles" class="selected-files" aria-live="polite">No files selected</p>
            <details class="other-inputs">
              <summary>Other ways to share evidence</summary>
              <label>Paste a message, link, or notes
                <textarea id="wcPastedText" rows="3" placeholder="Paste only what you are comfortable sharing."></textarea>
              </label>
              <label>Upload a voice note
                <input id="wcAudioUpload" type="file" accept="audio/*,.m4a,.webm,.mp3" />
              </label>
            </details>
            <div class="processing-state hidden" id="wcProcessingState" role="status" aria-live="polite"></div>
            <div class="button-stack">
              <button id="prepareWcButton" class="primary" type="button" data-action="process-wc-evidence" disabled>Upload and create report</button>
              <button class="secondary" type="button" data-action="mock-wc-evidence">Use sample</button>
            </div>
            <small class="privacy-line">Files are processed for this draft and are not intentionally stored.</small>
          </div>
        </div>
      </section>
    </template>

    <template id="wc-evidence-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-next="wcStart">Back</button>
        <p class="eyebrow">Evidence</p>
        <h2>Continue from prerequisites</h2>
        <p class="support-note">Evidence upload now starts on the prerequisites page.</p>
        <button class="primary" type="button" data-next="wcStart">Go to prerequisites</button>
      </section>
    </template>

    <template id="wc-workspace-template">
      <section class="report-workspace">
        <aside class="report-sidebar" aria-label="Women and children report sections">
          <button class="ghost workspace-back" type="button" data-action="back-to-wc-evidence">Back</button>
          <p class="eyebrow">Your report</p>
          <nav id="wcSectionNav" class="section-nav wc-section-nav" aria-label="Women and children report section navigation"></nav>
          <p id="wcSidebarHelp" class="sidebar-help">You can stay anonymous. Share only what feels safe.</p>
        </aside>
        <div id="wcSectionContent" class="report-section"></div>
      </section>
    </template>

    <template id="wc-review-template">
      <section class="panel">
        <button class="ghost back" type="button" data-next="wcEvidence">Back</button>
        <p class="eyebrow">AI-prepared draft</p>
        <h2>Review what was understood</h2>
        <div id="wcExtractionMode" class="mode-badge">AI prepared · Needs your review</div>
        <p class="support-note">Everything below is editable. AI can make mistakes—change or remove anything that does not look right.</p>
        <div class="form-grid wc-evidence-form"></div>
        <label class="wide-field">Sequence of events
          <textarea id="wcTimeline"></textarea>
        </label>
        <div class="button-row">
          <button class="primary" type="button" data-action="save-wc-review">Complaint details</button>
        </div>
      </section>
    </template>

    <template id="wc-complaint-template">
      <section class="panel">
        <button class="ghost back" type="button" data-action="wc-complaint-back">Back</button>
        <p class="eyebrow">Complaint and incident details</p>
        <h2>Confirm the report details</h2>
        <div class="form-grid wc-complaint-form"></div>
        <label class="wide-field">Additional information about the incident
          <textarea id="wcDescription" minlength="200" maxlength="1500"></textarea>
          <small id="wcDescriptionCount">0 / 200 minimum</small>
        </label>
        <button class="primary" type="button" data-action="save-wc-complaint">Suspect details</button>
      </section>
    </template>

    <template id="wc-suspect-template">
      <section class="panel">
        <button class="ghost back" type="button" data-next="wcComplaint">Back</button>
        <p class="eyebrow">Optional</p>
        <h2>Suspect details</h2>
        <p class="support-note">You can skip this section. Add details only if you know them and feel comfortable sharing them in the report.</p>
        <label class="inline-check"><input id="wcShareSuspect" type="checkbox" /> I have suspect details to share</label>
        <div class="form-grid wc-suspect-form muted-section"></div>
        <label class="upload-zone compact-upload muted-section" id="wcSuspectPhoto">
          <input type="file" accept="image/*,.pdf" />
          <span><strong>Upload suspect photograph</strong><small>Optional and mocked in this prototype.</small></span>
        </label>
        <button class="primary" type="button" data-action="save-wc-suspect">Preview report</button>
      </section>
    </template>

    <template id="wc-preview-template">
      <section class="panel">
        <button class="ghost back" type="button" data-action="edit-wc-section" data-section="suspectDetails">Back to report</button>
        <p class="eyebrow">Preview and submit</p>
        <h2>Review your report</h2>
        <p class="support-note">Review the organised draft before prototype submission. Edit anything incorrect; this is not an official filing.</p>
        <div id="wcPreviewContent" class="preview-grid"></div>
        <label class="inline-check certification"><input id="wcCertify" type="checkbox" /> I confirm this report is ready for prototype submission.</label>
        <button class="primary" type="button" data-action="submit-wc-report">Submit prototype report</button>
      </section>
    </template>

    <template id="wc-done-template">
      <section class="panel narrow success">
        <p class="eyebrow">Prototype submission complete</p>
        <h2>Report prepared</h2>
        <p>Your report was completed in <strong id="wcFinalTime">00:00</strong>. No data was sent to the official portal.</p>
        <p class="hint">Prototype acknowledgement only — not an official government reference number.</p>
        <aside class="danger-card" aria-label="Real-world safety next steps">
          <strong>This prototype cannot provide emergency help</strong>
          <span>For immediate danger call <a href="tel:112">112</a>. For a real cybercrime report, use <a href="https://www.cybercrime.gov.in/" target="_blank" rel="noopener noreferrer">cybercrime.gov.in</a>.</span>
        </aside>
        <p class="support-note">Prototype complete. For immediate danger use 112; for a real report use the official portal.</p>
        <button class="primary" type="button" data-action="go-home">Go to Home</button>
      </section>
    </template>

    <template id="user-type-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-action="go-home">Back</button>
        <p class="eyebrow">Financial crime report</p>
        <h2>Continue as</h2>
        <div class="two-actions">
          <button class="choice-card" type="button" data-action="start-existing-financial">
            <span class="choice-icon" aria-hidden="true">↻</span>
            <span><strong>Existing User</strong><small>Use mobile OTP to continue</small></span>
          </button>
          <button class="choice-card primary-choice" type="button" data-action="start-new-financial">
            <span class="choice-icon" aria-hidden="true">+</span>
            <span><strong>New User</strong><small>Sign up with mobile OTP and identity details</small></span>
          </button>
        </div>
      </section>
    </template>

    <template id="existing-login-template">
      <section class="panel narrow">
        <button class="ghost back" type="button" data-next="userType">Back</button>
        <p class="eyebrow">Mock login</p>
        <h2>Verify your mobile number</h2>
        <label>Mobile number
          <input id="mobileInput" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" />
        </label>
        <button class="secondary" type="button" data-action="send-otp">Get OTP</button>
        <div id="otpArea" class="hidden">
          <p class="hint">Mocked OTP sent: <strong>123456</strong></p>
          <label>Enter OTP
            <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
          </label>
          <button class="primary" type="button" data-action="verify-otp">Verify and continue</button>
        </div>
      </section>
    </template>

    <template id="new-user-template">
      <section class="panel">
        <button class="ghost back" type="button" data-next="userType">Back</button>
        <p class="eyebrow">One-time profile setup</p>
        <h2>Tell us who is reporting</h2>
        <p class="support-note">Upload an identity document to prepare personal details for this prototype. Do not upload a real Aadhaar, PAN card, driving licence, or voter ID here.</p>
        <label>Identity document type
          <select id="reporterIdentityType">
            <option value="Aadhaar">Aadhaar</option>
            <option value="PAN card">PAN card</option>
            <option value="Driving licence">Driving licence</option>
            <option value="Voter ID">Voter ID</option>
          </select>
        </label>
        <div class="upload-zone">
          <input id="reporterIdentityUpload" type="file" accept="image/*,.pdf" />
          <div>
            <strong>Upload identity document</strong>
            <span>PNG, JPG, PDF · Up to 4 MB</span>
          </div>
          <button class="secondary" type="button" data-action="process-profile">Extract identity details</button>
        </div>
        <div id="signupIdentityDocument" class="document-display"></div>
        <div id="newUserProfileArea" class="hidden">
          <div class="form-grid profile-form"></div>
          <div class="button-row">
            <button class="primary" type="button" data-action="save-profile">Save</button>
          </div>
        </div>
      </section>
    </template>

    <template id="prereq-template">
      <section class="panel prereq-panel">
        <button class="ghost back" type="button" data-action="financial-prereq-back">Back</button>
        <p class="eyebrow">Before you start</p>
        <h2>Keep these details ready</h2>
        <p class="support-note">You can manually fill the report by having these details ready. For assistance and easier filling, upload the documents and attachments—AI will read and fill the form. You can simply review and submit them.</p>
        <div class="prereq-layout">
          <div class="prereq-list">
            <h3 id="detailsReadyHeading">Information you may need</h3>
            <ul class="ready-list">
              <li>Incident date and approximate time</li>
              <li>Bank, wallet, or payment app name</li>
              <li>Transaction ID or 12-digit UTR</li>
              <li>Transaction date and fraud amount</li>
              <li id="reporterIdentityReadiness">Reporter’s government-issued identity document</li>
              <li>A separate affected-person ID if reporting for someone else</li>
              <li>Any other information you remember</li>
            </ul>
            <p class="hint">You can correct or complete missing information in the report.</p>
            <button id="manualFinancialButton" class="secondary" type="button" data-action="manual-financial-continue">Enter details manually</button>
          </div>
          <div class="or-divider" aria-hidden="true"><span>or</span></div>
          <div class="evidence-card">
            <h3>Let AI prepare a starting draft</h3>
            <p class="upload-intro">Upload screenshots of conversations, bank statements, photos, videos, documents, or voice notes. Add what you already have—you can review everything before continuing.</p>
            <ul class="evidence-examples">
              <li>Documents (PDF, DOCX, XLSX, CSV)</li>
              <li>Screenshots and photos (PNG, JPG)</li>
              <li>Videos (MP4, WEBM)</li>
              <li>Voice notes (M4A, WEBM, MP3)</li>
            </ul>
            <label class="file-drop">
              <input id="evidenceUpload" type="file" accept="image/*,video/*,.pdf,.docx,.xlsx,.csv,.mp4,.webm" multiple aria-describedby="financialUploadHelp selectedFinancialFiles" />
              <span class="file-drop-icon" aria-hidden="true">↑</span>
              <strong>Choose documents, screenshots, or videos</strong>
              <small id="financialUploadHelp">PNG, JPG, PDF, DOCX, XLSX, CSV, MP4, WEBM · Up to 4 MB total</small>
            </label>
            <p id="selectedFinancialFiles" class="selected-files" aria-live="polite">No files selected</p>
            <details class="other-inputs">
              <summary>Other ways to share evidence</summary>
              <label>Paste a bank SMS, message, URL, or notes
                <textarea id="financialPastedText" rows="3" placeholder="Example: INR 24,500 debited via UPI. UTR 409812345678."></textarea>
              </label>
              <label>Upload a voice note
                <input id="financialAudioUpload" type="file" accept="audio/*,.m4a,.webm,.mp3" />
              </label>
            </details>
            <div class="processing-state hidden" id="financialProcessingState" role="status" aria-live="polite"></div>
            <div class="button-stack">
              <button id="prepareFinancialButton" class="primary" type="button" data-action="process-financial-evidence" disabled>Upload and create report</button>
              <button class="secondary" type="button" data-action="mock-evidence-and-continue">Use sample</button>
            </div>
            <small class="privacy-line">Files are processed for this draft and are not intentionally stored.</small>
          </div>
        </div>
      </section>
    </template>

    <template id="financial-workspace-template">
      <section class="report-workspace">
        <aside class="report-sidebar" aria-label="Financial report sections">
          <button class="ghost workspace-back" type="button" data-action="back-to-evidence">Back</button>
          <p class="eyebrow">Your report</p>
          <nav class="section-nav" aria-label="Financial report section navigation">
            <button type="button" data-report-section="myDetails"><span>1</span><strong>Personal Details</strong><small>About the complainant</small></button>
            <button type="button" data-report-section="incidentDetails"><span>2</span><strong>Incident Details</strong><small>What happened</small></button>
            <button type="button" data-report-section="suspectDetails"><span>3</span><strong>Suspect Details</strong><small>Optional information</small></button>
          </nav>
          <p class="sidebar-help">Your changes stay in this browser only while you prepare the prototype report.</p>
        </aside>
        <div id="reportSectionContent" class="report-section"></div>
      </section>
    </template>

    <template id="preview-template">
      <section class="panel">
        <button class="ghost back" type="button" data-action="edit-report-section" data-section="suspectDetails">Back to report</button>
        <p class="eyebrow">Preview and submit</p>
        <h2>Review your report</h2>
        <p class="support-note">Final check of the AI-assisted draft. Nothing is sent to the official portal; submit only creates a prototype acknowledgement for this demo. Check each section and return to edit anything that does not look right.</p>
        <div id="previewContent" class="preview-grid"></div>
        <label class="inline-check certification"><input id="certify" type="checkbox" /> I confirm the information is correct for this prototype submission.</label>
        <div class="button-row">
          <button class="secondary" type="button" data-action="edit-report-section" data-section="myDetails">Edit report</button>
          <button class="primary" type="button" data-action="submit-report">Submit prototype report</button>
        </div>
      </section>
    </template>

    <template id="done-template">
      <section class="panel narrow success">
        <p class="eyebrow">Prototype submission complete</p>
        <h2>Your report is ready</h2>
        <p>Your report was completed in <strong id="finalTime">00:00</strong>. No data was sent to the official portal.</p>
        <div class="ack-card"><small>Prototype acknowledgement only — not an official government reference number.</small><strong>NCCRP-FIN-2026-10482</strong></div>
        <button class="primary download-button" type="button" data-action="download-report-pdf">Download report as PDF</button>
        <p id="pdfStatus" class="hint" role="status" aria-live="polite"></p>
        <aside class="urgent-card" aria-label="Next steps for a real report">
          <strong>Next step for a real financial fraud</strong>
          <span>Call <a href="tel:1930">1930</a> immediately, then complete the complaint on <a href="https://www.cybercrime.gov.in/" target="_blank" rel="noopener noreferrer">cybercrime.gov.in</a>. This prototype cannot submit it for you.</span>
        </aside>
        <div class="button-row centered">
          <button class="secondary" type="button" data-next="trackingLookup">Track sample complaint</button>
          <button class="primary" type="button" data-action="go-home">Go to Home</button>
        </div>
      </section>
    </template>

    <script src="app.bundle.js"></script>
  </body>
</html>
